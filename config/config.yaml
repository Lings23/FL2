# ============================================================
#  Federated Security Research Framework — Master Config
# ============================================================

# ── Global ──────────────────────────────────────────────────
project:
  name: "FedSec"
  seed: 42
  log_level: "INFO"
  checkpoint_dir: "checkpoints/"
  log_dir: "logs/"

# ── Federated Learning ───────────────────────────────────────
federation:
  num_rounds: 50
  num_clients: 20
  clients_per_round: 10         # optimized default: 10 selected clients per round
  min_fit_clients: 10
  min_evaluate_clients: 3
  min_available_clients: 20
  max_client_samples: 0          # smoke tests may cap local train samples

# ── Dataset ──────────────────────────────────────────────────
dataset:
  name: "cifar10"               # cifar10 | mnist | femnist
  data_dir: "data/"
  download_source: "huggingface" # huggingface | torchvision
  partition: "iid"              # iid | non_iid | dirichlet
  dirichlet_alpha: 0.5          # used when partition=dirichlet
  num_classes: 10
  val_split: 0.1

# ── Model ────────────────────────────────────────────────────
model:
  architecture: "resnet18"      # resnet18 | cnn | mlp
  pretrained: false
  num_classes: 10

# ── Client Training ──────────────────────────────────────────
client:
  local_epochs: 5
  batch_size: 48                # optimized for 10-way fit concurrency on RTX 4060
  optimizer: "sgd"              # sgd | adam
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 1e-4
  lr_scheduler: "cosine"        # cosine | step | none

# ── Aggregation Strategy ─────────────────────────────────────
strategy:
  name: "fedavg"                # fedavg | fedprox | fedyogi | scaffold | custom
  # FedProx
  proximal_mu: 0.01
  # FedYogi
  eta: 0.01
  eta_l: 0.0316
  beta_1: 0.9
  beta_2: 0.99
  tau: 1e-3

# ── Security ─────────────────────────────────────────────────
security:
  # Attack settings (for simulation)
  attack:
    enabled: false
    type: "none"                # none | label_flip_targeted | label_flip_all_reverse | backdoor | dba | gaussian_noise | byzantine | model_replacement | mpaf
    malicious_fraction: 0.2     # fraction of malicious clients
    # Backdoor / DBA specific
    backdoor_target_label: 0
    trigger_pattern: "pixel"    # pixel | pattern
    poison_fraction: 0.1
    trigger_size: 3
    trigger_value: 1.0
    dba_trigger_num: 4
    dba_gap: 3
    dba_base_row: 0
    dba_base_col: 0
    dba_scale_update: true
    dba_boost_factor: 10.0
    model_replacement_boost_factor: 10.0
    mpaf_lambda: 1.0
    mpaf_base_scale: 0.0
    mpaf_max_update_norm: 0.0
    gaussian_noise_std: 0.1
    attack_start_round: 1
    attack_end_round: -1          # -1 means no end round
    attack_on_rounds: 1
    attack_off_rounds: 0          # e.g. on=3/off=3 for intermittent attacks
    # Label flip specific
    source_label: 5               # CIFAR-10 Dog
    target_label: 3               # CIFAR-10 Cat
    label_flip_poison_fraction: 1.0

  # Defense settings
  defense:
    enabled: false
    type: "none"                # none | krum | trimmed_mean | median | fltrust | foolsgold | freqfed | time_consistency | your_defense
    # Krum
    krum_num_to_select: 1
    krum_num_malicious: 1
    # Trimmed Mean
    trim_fraction: 0.1
    # FLTrust
    root_dataset_size: 100
    reserve_root_for_all: false   # periodic comparison sets true for a common holdout
    # Method-specific examples:
    # FLTrust: {root_epochs: 1, root_batch_size: 32, root_optimizer: sgd,
    #           root_learning_rate: 0.01, server_lr: 1.0,
    #           use_num_examples: false, zero_trust_fallback: server_update}
    # FoolsGold: {history_decay: 1.0, history_max_idle_rounds: 50,
    #             use_num_examples: true, logit_offset: 0.5}
    # FreqFed: {low_frequency_ratio: 0.5, low_frequency_shape: triangular,
    #           min_cluster_size: 3, min_samples: 2,
    #           min_selected_clients: 2, projection_dim: 0,
    #           fallback: median, seed: 42}
    # Extension point: add your defense parameters here.
    # Example for time_consistency / RTC-v2:
    # custom_params:
    #   version: rtc_v2
    #   projection_dim: 2048
    #   max_history: 30
    #   offline_reset_rounds: 10
    #   min_history_for_self_score: 5
    #   min_temporal_points: 8
    #   high_risk_window: 6
    #   risk_weights: {magnitude: 0.30, direction: 0.25, temporal: 0.30, influence: 0.15}
      #   peak_risk_weight: 0.75
      #   watch_threshold: 0.55
      #   restricted_threshold: 0.70
      #   quarantine_threshold: 0.80
      #   immediate_quarantine_threshold: 0.95
      #   quarantine_window: 4
      #   quarantine_strikes: 2
      #   recovery_threshold: 0.35
      #   recovery_observations: 3
    #   high_risk_threshold: 0.70
    #   medium_risk_threshold: 0.40
    #   trust_beta: 0.75
    #   min_trust: 0.05
      #   state_weight_cap_multipliers: {normal: 2.0, watch: 1.0, restricted: 0.1, quarantined: 0.0}
    #   enable_soft_trust_weighting: true
    #   enable_delta_clipping: true
    #   clip_multiplier: 1.0
    #   enable_trust_caps: true
      #   enable_exposure_budgets: true
      #   exposure_window: 4
      #   client_exposure_budget_multiplier: 4.0
      #   direction_exposure_budget_multiplier: 4.0
    #   min_effective_clients: 3
    #   fallback_strategy: skip_update
    #   log_client_weights: true
    #   enable_temporal_features: true
    #   enable_direction_features: true
    #   enable_influence_features: true
    custom_params: {}

# ── Evaluation ───────────────────────────────────────────────
evaluation:
  metrics:
    - "accuracy"
    - "loss"
    - "backdoor_asr"            # Attack Success Rate (optional)
  eval_every_n_rounds: 1
  save_best_model: true
  max_test_samples: 0           # smoke tests may cap server evaluation samples
  early_stopping:
    enabled: false
    patience: 10
    min_delta: 0.001

# ── Differential Privacy ─────────────────────────────────────
differential_privacy:
  enabled: false
  noise_multiplier: 1.0
  max_grad_norm: 1.0
  delta: 1e-5

# ── Ray Simulation Resources ─────────────────────────────────
ray:
  client_num_cpus: 1.0          # CPU quota per Flower client actor
  client_num_gpus: 0.0          # set 0.5/1.0 on multi-GPU hosts
  log_to_driver: false
  include_dashboard: false
  object_store_memory_mb: 0     # 0 keeps Ray's automatic sizing for direct runs
  min_available_memory_mb: 0    # matrix profiles override this with a safety gate
  memory_wait_seconds: 120.0
  memory_poll_seconds: 2.0
